name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check src/
      - name: Ruff format check
        run: ruff format --check src/
      - name: Type check
        run: mypy src/ --ignore-missing-imports

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install radon
      - name: Cyclomatic complexity check (NFR-M-02)
        run: |
          echo "=== 圈复杂度检查 ==="
          # 检查圈复杂度：显示所有 C 级及以上（>=8）的函数
          radon cc src/ -a -nc --show-complexity
          # 门禁：不允许 F 级（>=21）的函数存在
          F_COUNT=$(radon cc src/ -s | grep -c " F " || true)
          if [ "$F_COUNT" -gt 0 ]; then
            echo "❌ 发现 $F_COUNT 个 F 级（极高风险）函数，请重构"
            exit 1
          fi
          echo "✅ 无 F 级函数"
          # 统计各级别数量
          echo ""
          echo "=== 复杂度分布 ==="
          echo "A 级 (1-5, 低风险):   $(radon cc src/ -s | grep -c " A " || echo 0)"
          echo "B 级 (6-10, 中风险):  $(radon cc src/ -s | grep -c " B " || echo 0)"
          echo "C 级 (11-20, 高风险): $(radon cc src/ -s | grep -c " C " || echo 0)"
          echo "F 级 (21+, 极高风险): $(radon cc src/ -s | grep -c " F " || echo 0)"
      - name: Maintainability index check
        run: |
          echo "=== 维护性指数检查 ==="
          radon mi src/ -s
          # 统计低于 B 级的模块
          LOW_MI=$(radon mi src/ -s | grep -cE " [CD] " || true)
          if [ "$LOW_MI" -gt 0 ]; then
            echo "⚠️ 发现 $LOW_MI 个模块维护性指数低于 B 级"
          else
            echo "✅ 所有模块维护性指数达到 B 级及以上"
          fi

  test:
    runs-on: ubuntu-latest
    needs: [lint, complexity]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=finagent --cov-report=xml
      - name: Check coverage
        run: |
          coverage report --fail-under=80

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t finagent-eval:${{ github.sha }} .
      - name: Test Docker image
        run: |
          docker run -d --name finagent-test -p 8000:8000 finagent-eval:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker stop finagent-test
