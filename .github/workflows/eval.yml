name: Evaluation Pipeline

on:
  push:
    branches: [main]
    paths:
      - "src/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
  workflow_dispatch:
    inputs:
      agent_type:
        description: "Agent type to evaluate"
        required: false
        default: "langgraph"
        type: choice
        options:
          - langgraph
          - autogen
          - crewai
          - http
          - mock
      eval_mode:
        description: "Evaluation mode"
        required: false
        default: "quick"
        type: choice
        options:
          - quick
          - full
      dataset:
        description: "Dataset to use"
        required: false
        default: "bizfinbench"
        type: choice
        options:
          - bizfinbench
          - finmcp_bench
          - fintrust
          - stockbench
          - traderbench

  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9:00 AM UTC

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  evaluate:
    name: Run Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short

      - name: Run quick evaluation
        run: |
          python -m finagent.cli eval --mode ${{ github.event.inputs.eval_mode || 'quick' }} --agent ${{ github.event.inputs.agent_type || 'mock' }}

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results-${{ github.sha }}
          path: |
            results/
            reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Generate evaluation report
        if: always()
        run: |
          python -m finagent.cli report --output reports/evaluation_report.md || true

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let commentBody = '## Evaluation Results\n\n';

            // Check if report was generated
            let reportPath = 'reports/evaluation_report.md';
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              commentBody += '### Report\n\n';
              commentBody += '```\n' + report.slice(0, 5000) + '\n```\n\n';
            }

            commentBody += '---\n';
            commentBody += `**Commit:** \`${{ github.sha }}\`\n`;
            commentBody += `**Agent:** ${{ github.event.inputs.agent_type || 'mock' }}\n`;
            commentBody += `**Mode:** ${{ github.event.inputs.eval_mode || 'quick' }}\n`;
            commentBody += `**Dataset:** ${{ github.event.inputs.dataset || 'bizfinbench' }}\n`;
            commentBody += `[View full results in artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
