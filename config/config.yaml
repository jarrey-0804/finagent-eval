# FinAgent-Eval 配置文件

# 数据库配置
database:
  url: "postgresql://localhost:5432/finagent_eval"
  pool_size: 10
  max_overflow: 20

# LLM配置
llm:
  openai_api_key: "${OPENAI_API_KEY}"
  anthropic_api_key: "${ANTHROPIC_API_KEY}"
  deepseek_api_key: "${DEEPSEEK_API_KEY}"
  default_model: "gpt-4o"
  temperature: 0.1
  max_tokens: 2048

# 评测配置
evaluation:
  default_mode: "full"
  max_concurrent_tasks: 5
  task_timeout: 300
  pass_threshold: 60.0
  veto_threshold: 30.0

# API配置
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  cors_origins:
    - "*"

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null
