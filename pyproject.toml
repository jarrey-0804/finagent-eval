[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent-eval"
version = "1.0.0"
description = "金融AI Agent评测系统 - 标准化的评测框架"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "FinAgent Team", email = "finagent@example.com"}
]
keywords = ["ai", "agent", "evaluation", "finance", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "asyncpg>=0.28.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.0.280",
    "radon>=6.0.0",
]
langchain = [
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
]
openai = [
    "openai>=1.0.0",
]
anthropic = [
    "anthropic>=0.18.0",
]
all = [
    "finagent-eval[dev,langchain,openai,anthropic]",
]

[project.scripts]
finagent-eval = "finagent.cli:main"

[project.urls]
Homepage = "https://github.com/finagent/finagent-eval"
Documentation = "https://github.com/finagent/finagent-eval#readme"
Repository = "https://github.com/finagent/finagent-eval"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "benchmark: 性能基准测试",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.radon]
# 圈复杂度阈值配置 (NFR-M-02)
cc_threshold = "B"       # B 级 (5-7) 为通过阈值，C 级 (8-14) 及以上为不通过
mi_threshold = "B"       # 维护性指数阈值
show_complexity = true

[tool.radon.cc]
# 各模块圈复杂度上限
average = "B"
total_max = "C"
